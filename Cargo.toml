[package]
name = "forge-ml"
version = "0.6.0"
edition = "2024"
rust-version = "1.87"
license = "AGPL-3.0-only"
description = "A WebGPU-native machine learning runtime in Rust: train and run GPT-2 and encoder-decoder transformers on any GPU wgpu reaches, with no CUDA and no Python"
repository = "https://github.com/Aisuko/forge"
homepage = "https://aisuko.github.io/forge/"
documentation = "https://docs.rs/forge-ml"
readme = "README.md"
keywords = ["machine-learning", "webgpu", "wgpu", "gpt2", "encoder-decoder"]
categories = ["science", "wasm", "graphics"]
include = [
    "src/**/*.rs",
    "shaders/*.wgsl",
    "examples/*.rs",
    "tests/**/*",
    "README.md",
    "LICENSE",
]

[lib]
name = "forge"
crate-type = ["rlib", "cdylib"]

[workspace]
members = ["tools/council", "tools/forge-top", "tools/surprise"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
train = []

[[test]]
name = "training"
required-features = ["train"]

[[test]]
name = "autograd"
required-features = ["train"]

[[test]]
name = "train_ops"
required-features = ["train"]

[[test]]
name = "encoder_ops"
required-features = ["train"]

[[example]]
name = "train_shakespeare"
required-features = ["train"]

[[example]]
name = "fzm_bench"
required-features = ["train"]

[dependencies]
bytemuck = "1"
fancy-regex = "0.14"
rand = "0.9"
safetensors = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "26"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
rayon = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# No source-level `use`, but the #[wasm_bindgen] macro expands the async
# exports in src/wasm.rs into code naming it. Removing it fails wasm32 with E0433.
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
