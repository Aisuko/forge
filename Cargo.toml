[package]
# `forge` was taken on crates.io in 2017, so the crate publishes as `forge-ml`.
# `[lib] name` below keeps the import path `use forge::...` for dependents.
name = "forge-ml"
version = "0.5.0"
edition = "2024"
# 1.85 for edition 2024, but src/tensor.rs uses integer `is_multiple_of`, which
# landed in 1.87 — clippy's incompatible_msrv lint holds this honest.
rust-version = "1.87"
license = "AGPL-3.0-only"
description = "A WebGPU-native machine learning runtime in Rust: train and run GPT-2 on any GPU wgpu reaches, with no CUDA and no Python"
repository = "https://github.com/Aisuko/forge"
homepage = "https://aisuko.github.io/forge/"
documentation = "https://docs.rs/forge-ml"
readme = "README.md"
keywords = ["machine-learning", "webgpu", "wgpu", "gpt2", "transformer"]
categories = ["science", "wasm", "graphics"]
# Without this the tarball is 38.8 MiB — the 43 MB checkpoint, the site, the
# scripts — and crates.io rejects it at 10 MiB. With it, 439 KiB. The WGSL is
# not optional: src/backend/wgpu/mod.rs include_str!s every shader.
include = [
    "src/**/*.rs",
    "shaders/*.wgsl",
    "examples/*.rs",
    "tests/**/*",
    "README.md",
    "LICENSE",
]

[lib]
name = "forge"
crate-type = ["rlib", "cdylib"]

[workspace]
members = ["tools/council", "tools/forge-top", "tools/surprise"]

# `train` is not a default feature, so docs.rs needs all-features to show it.
# The `docsrs` cfg turns on the doc(cfg(...)) badges in src/lib.rs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Autograd, AdamW and the backward kernels. Off by default: a dependent doing
# inference should not compile a tape it never records, and src/wasm.rs exports
# no training at all. Gates code, not dependencies — there are none to gate.
train = []

# The training targets. `required-features` makes a default build skip them
# rather than fail to compile them, which keeps `cargo package` green. Cargo
# merges these with autodiscovered targets, so nothing else is lost.
[[test]]
name = "training"
required-features = ["train"]

[[test]]
name = "autograd"
required-features = ["train"]

[[test]]
name = "train_ops"
required-features = ["train"]

[[example]]
name = "train_shakespeare"
required-features = ["train"]

[[example]]
name = "fzm_bench"
required-features = ["train"]

[dependencies]
bytemuck = "1"
fancy-regex = "0.14"
rand = "0.9"
safetensors = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "26"

# Native only: sync facades (pollster / poll-wait readback) and rayon.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
rayon = "1"

# The integration tests exercise the async inference API — the path the browser
# takes — so they need a blocking executor.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4"

# Browser (wasm32): async-only device APIs + JS bindings.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# No source-level `use`, but the #[wasm_bindgen] macro expands the async
# exports in src/wasm.rs into code naming it. Removing it fails wasm32 with E0433.
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Smaller wasm binaries; negligible effect on native perf here.
lto = "thin"
