name: Release to crates.io

# Tag a commit `vX.Y.Z` and publish the GitHub Release; this ships that version
# to crates.io as `forge-ml`. Nothing publishes on push.
#
# Auth is crates.io Trusted Publishing — the run's OIDC identity is exchanged
# for a short-lived token, so there is no CARGO_REGISTRY_TOKEN to leak. Set up
# on crates.io -> forge-ml -> Settings -> Trusted Publishing, with owner
# `Aisuko`, repository `forge`, workflow `release.yml`.
#
# verify does not re-run fmt, clippy, the builds or the tests: those are the
# pre-push gate on a machine with a GPU and models/gpt2/, which a hosted runner
# cannot match. What is left is only what publishing adds — the tag matching
# the manifest, the docs.rs render, and a tarball that compiles standalone.

on:
  release:
    types: [published]
  # Dry run — everything except the publish step, so the pipeline can be proven
  # before a real release depends on it.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify tag + package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A tag that disagrees with the manifest publishes the wrong version
      # under the right name. `packages` is workspace-wide and unordered, so
      # pick forge-ml by name.
      - name: Tag must match the manifest version
        if: github.event_name == 'release'
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys,json; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "forge-ml"))')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "publishing forge-ml $manifest"

      # A broken intra-doc link is a shipped defect: unlike a test failure it
      # cannot be fixed without a new version. `--all-features` matches what
      # docs.rs itself builds with.
      - name: Rustdoc (no warnings)
        run: cargo doc -p forge-ml --no-deps --locked --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # crates.io rejects anything over 10 MiB; the `include` list keeps this at
      # ~440 KiB. `cargo package` also compiles the tarball standalone, which no
      # workspace build exercises.
      - name: Package (verifies the tarball builds on its own)
        run: cargo package -p forge-ml --locked

  publish:
    name: cargo publish
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      # Required to mint the OIDC token that crates.io trades for a registry token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # `-p forge-ml`: the tools in tools/ are `publish = false`.
      - run: cargo publish -p forge-ml --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
