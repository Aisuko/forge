name: CI (manual)

# The primary gate for this repo is local, not here: .githooks/pre-commit runs
# `scripts/ci_local.sh fast` and .githooks/pre-push runs `full` — the whole
# release test suite, on a machine with an NVIDIA RTX A5000 and the gitignored
# 548 MB models/gpt2/ present. See CONTRIBUTING.md for the one-time install.
#
# This workflow has no push or pull_request trigger — it only runs on manual
# dispatch. It exists for the one case the local hooks cannot cover: a pull
# request from a fork, where nobody's hooks ran on the code.
#
# It deliberately runs `fast`, not `full`. Hosted runners have no GPU, so every
# WGPU test would execute against Mesa's software Vulkan driver, and without
# models/gpt2/ the suites that check real GPT-2 numerics against HF
# `transformers` self-skip. A green run here would therefore be weaker than it
# looks, while costing minutes. The tests stay where they can actually prove
# something: the maintainer's pre-push hook, on the merge.
#
# Invoking ci_local.sh rather than restating its stages in YAML is the point —
# there is one definition of "green", and this cannot drift from it.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    name: fmt + clippy + builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci_local.sh fast
