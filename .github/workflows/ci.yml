name: CI (manual)

# The gate for this repo is local: .githooks/pre-commit runs
# `scripts/ci_local.sh fast`, pre-push runs `full` on a machine with an RTX
# A5000 and models/gpt2/ present. See CONTRIBUTING.md.
#
# No push or pull_request trigger. This covers the one case the hooks cannot —
# a fork PR, where nobody's hooks ran — and runs `fast`, because hosted runners
# have no GPU and the weight-dependent suites would self-skip.
#
# It invokes ci_local.sh rather than restating its stages, so the two cannot
# drift.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    name: fmt + clippy + builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # ci_local.sh fast ends with the site build, which needs the CLI pinned
      # to the wasm-bindgen in Cargo.lock.
      - name: wasm-bindgen-cli
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${v}/wasm-bindgen-${v}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin \
              "wasm-bindgen-${v}-x86_64-unknown-linux-musl/wasm-bindgen"

      - run: ./scripts/ci_local.sh fast
