<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge — GPT-2 in the browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: ui-sans-serif, system-ui, sans-serif;
    max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5;
  }
  h1 { font-size: 1.4rem; }
  #status { color: gray; min-height: 1.2em; }
  textarea, input, select, button { font: inherit; }
  textarea { width: 100%; box-sizing: border-box; }
  #out {
    white-space: pre-wrap; border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
    border-radius: 6px; padding: 0.8rem; min-height: 8rem; margin-top: 1rem;
  }
  .row { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; margin: 0.6rem 0; }
  #gate { font-weight: 600; }
  .pass { color: #1a7f37; } .fail { color: #cf222e; }
  progress { width: 100%; }
</style>
</head>
<body>
<h1>Forge — GPT-2 (124M) on WebGPU, in your browser</h1>
<p id="status">loading…</p>
<progress id="fetchbar" max="1" value="0" hidden></progress>

<textarea id="prompt" rows="3">The old lighthouse keeper</textarea>
<div class="row">
  <label>tokens <input id="ntok" type="number" value="30" min="1" max="500" style="width:5em"></label>
  <label>sampling
    <select id="mode">
      <option value="greedy" selected>greedy</option>
      <option value="topk">top-k (k=40, T=0.8)</option>
    </select>
  </label>
  <button id="go" disabled>Generate</button>
  <button id="gatebtn" disabled>Run Stage-11 gate check</button>
</div>
<div id="out"></div>
<p id="gate"></p>

<script type="module">
import init, { WasmGpt2 } from "./forge/forge.js";

const $ = (id) => document.getElementById(id);
const status = (t) => { $("status").textContent = t; };

async function fetchBytes(url, onProgress) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  const total = Number(res.headers.get("Content-Length")) || 0;
  const reader = res.body.getReader();
  const chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    got += value.length;
    if (total && onProgress) onProgress(got / total);
  }
  const out = new Uint8Array(got);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}

let model = null;

async function boot() {
  if (!navigator.gpu) {
    status("WebGPU is not available in this browser — use Chrome/Edge 113+.");
    return;
  }
  await init();
  status("fetching GPT-2 weights (~548 MB, cached by the browser)…");
  $("fetchbar").hidden = false;
  const base = "../models/gpt2";
  const [bytes, config, vocab, merges] = await Promise.all([
    fetchBytes(`${base}/model.safetensors`, (f) => { $("fetchbar").value = f; }),
    fetch(`${base}/config.json`).then((r) => r.text()),
    fetch(`${base}/vocab.json`).then((r) => r.text()),
    fetch(`${base}/merges.txt`).then((r) => r.text()),
  ]);
  $("fetchbar").hidden = true;
  status("creating WebGPU device and uploading weights…");
  model = await WasmGpt2.load(bytes, config, vocab, merges);
  status(`ready — ${model.device_info()}`);
  $("go").disabled = false;
  $("gatebtn").disabled = false;
}

$("go").addEventListener("click", async () => {
  $("go").disabled = true;
  $("out").textContent = "";
  const topk = $("mode").value === "topk" ? 40 : 0;
  const n = Number($("ntok").value);
  const t0 = performance.now();
  try {
    await model.generate($("prompt").value, n, topk, 0.8, 42n,
      (s) => { $("out").textContent += s; });
    const dt = (performance.now() - t0) / 1000;
    status(`generated ${n} tokens in ${dt.toFixed(1)}s (${(n / dt).toFixed(2)} tok/s)`);
  } catch (e) {
    status(`error: ${e}`);
  } finally {
    $("go").disabled = false;
  }
});

// Stage 11 gate (roadmap v4): browser greedy tokens must be identical to
// native WGPU for the same prompt. gate_expected.json is written by
// `cargo run --release --example gate_tokens`.
$("gatebtn").addEventListener("click", async () => {
  $("gatebtn").disabled = true;
  $("gate").textContent = "running gate check…";
  $("gate").className = "";
  try {
    const exp = await fetch("./gate_expected.json").then((r) => {
      if (!r.ok) throw new Error("gate_expected.json missing — run the gate_tokens example first");
      return r.json();
    });
    const ids = await model.greedy_ids(exp.prompt, exp.max_new_tokens);
    const got = Array.from(ids);
    const same = got.length === exp.ids.length && got.every((v, i) => v === exp.ids[i]);
    $("gate").textContent = same
      ? `GATE PASS — ${got.length} greedy tokens identical to native WGPU`
      : `GATE FAIL — first mismatch at index ${got.findIndex((v, i) => v !== exp.ids[i])}`;
    $("gate").className = same ? "pass" : "fail";
    // Machine-readable hooks for automated (headless) verification.
    window.__forge_gate = { pass: same, got, expected: exp.ids };
    document.title = same ? "GATE PASS" : "GATE FAIL";
  } catch (e) {
    $("gate").textContent = `gate error: ${e}`;
    $("gate").className = "fail";
    document.title = `GATE ERROR: ${e}`;
  } finally {
    $("gatebtn").disabled = false;
  }
});

// Headless verification mode: /web/?gate runs the gate check on load and
// reports through document.title (polled via the DevTools /json endpoint).
boot()
  .then(() => {
    if (new URLSearchParams(location.search).has("gate")) $("gatebtn").click();
  })
  .catch((e) => {
    status(`load failed: ${e}`);
    document.title = `GATE ERROR: ${e}`;
  });
</script>
</body>
</html>
